<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thina UI Ultra v2.0</title>
    <style>
        :root {
            --ios-blur: blur(25px);
            --system-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --app-anim: all 0.6s cubic-bezier(0.32, 0.72, 0, 1);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
        /* Phone Frame */
        .phone {
            width: 320px; height: 650px; background: #000; border: 8px solid #222;
            border-radius: 45px; position: relative; overflow: hidden; box-shadow: 0 30px 100px rgba(0,0,0,0.9);
        }
        /* 1. Welcome Screen */
        #welcome {
            position: absolute; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
            transition: opacity 1s;
        }
        /* 2. Lock Screen (Blurred & Clean) */
        #lock-screen {
            position: absolute; inset: 0; z-index: 1000;
            background: url('https://picsum.photos/id/28/320/650') center/cover;
            transition: transform 0.7s var(--system-ease), filter 0.5s;
            display: flex; flex-direction: column; align-items: center;
        }
        .blur-overlay { position: absolute; inset: 0; backdrop-filter: blur(15px); background: rgba(0,0,0,0.3); }
       
        .lock-content { position: relative; z-index: 2; text-align: center; color: white; margin-top: 80px; }
        .lock-time { font-size: 60px; font-weight: 200; }
       
        /* Swipe Handle at Bottom */
        .swipe-area {
            position: absolute; bottom: 30px; width: 100%; display: flex;
            flex-direction: column; align-items: center; z-index: 5;
        }
        .swipe-bar { width: 120px; height: 5px; background: rgba(255,255,255,0.8); border-radius: 10px; margin-top: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        /* 3. Home Screen */
        .home { position: absolute; inset: 0; background: url('https://picsum.photos/id/10/320/650') center/cover; padding: 50px 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .app-icon { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: transform 0.2s; }
        .app-icon:active { transform: scale(0.85); }
        /* 4. Navigation Buttons (Hidden on Lock Screen) */
        .nav-bar {
            position: absolute; bottom: 0; width: 100%; height: 40px;
            display: none; /* Initially hidden */
            justify-content: space-around; align-items: center; z-index: 1300;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        }
        .nav-btn { width: 16px; height: 16px; border: 2px solid white; cursor: pointer; }
        /* 5. App Window */
        #app-window {
            position: absolute; inset: 0; background: white; z-index: 1100;
            transform: scale(0.9) translateY(100%); opacity: 0; border-radius: 45px;
            transition: var(--app-anim); overflow: hidden;
        }
        #app-window.open { transform: scale(1) translateY(0); opacity: 1; border-radius: 0; }
        iframe { width: 100%; height: calc(100% - 40px); border: none; }
        /* Dynamic Notification */
        #notification {
            position: absolute; top: -100px; left: 10px; right: 10px;
            background: rgba(255,255,255,0.9); backdrop-filter: var(--ios-blur);
            border-radius: 20px; padding: 12px; color: #000; z-index: 1500;
            transition: top 0.5s var(--system-ease); font-size: 13px;
        }
    </style>
</head>
<body>
<div class="phone">
    <div id="welcome"><h1>Thina UI</h1><div style="width:30px; height:30px; border:3px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div></div>
    <div id="notification"><b>System</b><br>Welcome to Thina UI 2026</div>
    <div id="lock-screen">
        <div class="blur-overlay"></div>
        <div class="lock-content">
            <div class="lock-time" id="clock">09:41</div>
            <div style="font-size: 14px; opacity: 0.8;">Wednesday, April 1</div>
        </div>
        <div class="swipe-area" id="swipe-trigger" onmousedown="startSwipe(event)" onmouseup="endSwipe(event)" ontouchstart="startSwipe(event)" ontouchend="endSwipe(event)">
            <span style="font-size: 12px; color: white; opacity: 0.7;">Swipe up to unlock</span>
            <div class="swipe-bar"></div>
        </div>
    </div>
    <div class="home">
        <div class="app-icon" style="background: linear-gradient(#FF2D55, #D30030);" onclick="openApp('Music')">🎵</div>
        <div class="app-icon" style="background: #FF0000;" onclick="openApp('YouTube')">🎥</div>
        <div class="app-icon" style="background: #fff;" onclick="openApp('Browser')">🌐</div>
        <div class="app-icon" style="background: #333;" onclick="openCamera()">📷</div>
        <div class="app-icon" style="background: #5856D6;" onclick="openApp('AI')">🤖</div>
    </div>
    <div id="app-window">
        <div style="height: 40px; background: #f2f2f7; display: flex; align-items: center; padding: 0 20px; font-weight: 600; color: #000;" id="app-title">App</div>
        <div id="app-body" style="height: 100%;">
            <div id="ai-content" style="display:none; padding: 20px; color: #000;">
                <h3>Thina AI Assistant</h3>
                <p>How can I help you today?</p>
                <input type="text" placeholder="Type here..." style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc;">
            </div>
            <video id="cam-live" autoplay playsinline style="width:100%; height:100%; object-fit:cover; display:none; background: #000;"></video>
            <iframe id="app-frame" style="display:none; width:100%; height:100%;"></iframe>
        </div>
    </div>
    <div class="nav-bar" id="nav-bar">
        <div class="nav-btn" style="transform: rotate(45deg); border-top: 0; border-left: 0;" onclick="closeApp()"></div>
        <div class="nav-btn" style="border-radius: 50%;" onclick="closeApp()"></div>
        <div class="nav-btn" style="border-radius: 3px;"></div>
    </div>
</div>
<script>
    // Clock Update
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();
    // Welcome Screen Logic
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(() => document.getElementById('welcome').style.display = 'none', 1000);
        }, 2000);
    };
    // Swipe to Unlock Logic (Bottom Trigger)
    let startY = 0;
    function startSwipe(e) { startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY; }
    function endSwipe(e) {
        let endY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;
        if (startY - endY > 50) {
            document.getElementById('lock-screen').style.transform = 'translateY(-100%)';
            document.getElementById('nav-bar').style.display = 'flex'; // Show Nav buttons after unlock
            showNotif("Unlocked", "Welcome to Thina UI");
        }
    }
    // App Management
    function openApp(type) {
        const win = document.getElementById('app-window');
        const title = document.getElementById('app-title');
        const frame = document.getElementById('app-frame');
        const ai = document.getElementById('ai-content');
        const cam = document.getElementById('cam-live');
        title.innerText = type;
        ai.style.display = 'none';
        cam.style.display = 'none';
        frame.style.display = 'none';
        if(type === 'YouTube') { frame.src = "https://www.youtube.com/embed"; frame.style.display = 'block'; }
        else if(type === 'Music') { frame.src = "https://music.apple.com"; frame.style.display = 'block'; }
        else if(type === 'Browser') { frame.src = "https://www.google.com/search?igu=1"; frame.style.display = 'block'; }
        else if(type === 'AI') { ai.style.display = 'block'; }
        win.classList.add('open');
    }
    async function openCamera() {
        const win = document.getElementById('app-window');
        const cam = document.getElementById('cam-live');
        document.getElementById('app-title').innerText = "Camera";
        document.getElementById('app-frame').style.display = 'none';
        document.getElementById('ai-content').style.display = 'none';
        cam.style.display = 'block';
        win.classList.add('open');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            cam.srcObject = stream;
        } catch(e) { alert("Camera error: " + e.message); }
    }
    function closeApp() {
        document.getElementById('app-window').classList.remove('open');
        const cam = document.getElementById('cam-live');
        if(cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    }
    function showNotif(title, text) {
        const n = document.getElementById('notification');
        n.innerHTML = `<b>${title}</b><br>${text}`;
     n.style.top = '15px';
        setTimeout(() => n.style.top = '-100px', 3000);
    }
</script>
<style>
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
